name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:

  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  test:
    name: Frontend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false


  build:
    name: Build and Push Frontend Docker Image
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend Docker image
        working-directory: starter/frontend
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}"

          echo "Building image:"
          echo "$IMAGE"

          docker build \
            --build-arg "REACT_APP_MOVIE_API_URL=${{ secrets.REACT_APP_MOVIE_API_URL }}" \
            -t "$IMAGE" \
            .

      - name: Push frontend image to ECR
        id: build-image
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}"

          echo "Pushing image:"
          echo "$IMAGE"

          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"


  deploy:
    name: Deploy Frontend to EKS
    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Verify EKS connection
        run: |
          kubectl get nodes

      - name: Verify Kubernetes manifest
        working-directory: starter/frontend/k8s
        run: |
          echo "===== KUSTOMIZE OUTPUT ====="
          kubectl kustomize .

          echo "===== VALIDATING MANIFEST ====="
          kubectl apply --dry-run=client -k .

      - name: Apply frontend Kubernetes manifests
        working-directory: starter/frontend/k8s
        run: |
          kubectl apply -k .

      - name: Update frontend image
        run: |
          IMAGE="${{ needs.build.outputs.image }}"

          echo "Deploying image:"
          echo "$IMAGE"

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Frontend ECR image is empty"
            exit 1
          fi

          kubectl set image deployment/frontend \
            frontend="$IMAGE"

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Verify frontend image
        run: |
          echo "===== DEPLOYED FRONTEND IMAGE ====="

          kubectl get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

      - name: Verify frontend deployment
        run: |
          echo "===== FRONTEND DEPLOYMENT ====="
          kubectl get deployment frontend

          echo "===== FRONTEND PODS ====="
          kubectl get pods

          echo "===== FRONTEND SERVICE ====="
          kubectl get svc frontend

          echo "===== ALL KUBERNETES RESOURCES ====="
          kubectl get all