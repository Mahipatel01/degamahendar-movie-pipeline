name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:

  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run lint
        run: |
          npm run lint


  test:
    name: Frontend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run tests
        run: |
          CI=true npm test -- --watchAll=false


  build:
    name: Build and Push Frontend Docker Image
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg "REACT_APP_MOVIE_API_URL=${{ secrets.REACT_APP_MOVIE_API_URL }}" \
            -t ${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }} \
            .

      - name: Push frontend image to ECR
        working-directory: starter/frontend
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}


  deploy:
    name: Deploy Frontend to EKS
    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Verify EKS connection
        run: |
          kubectl get nodes

      - name: Apply frontend Kubernetes manifests
        working-directory: starter/frontend/k8s
        run: |
          kubectl apply -k .

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Verify frontend deployment
        run: |
          echo "===== FRONTEND DEPLOYMENT ====="
          kubectl get deployment frontend

          echo "===== FRONTEND PODS ====="
          kubectl get pods

          echo "===== FRONTEND SERVICE ====="
          kubectl get svc frontend

          echo "===== FRONTEND IMAGE ====="
          kubectl get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

          echo "===== ALL KUBERNETES RESOURCES ====="
          kubectl get all