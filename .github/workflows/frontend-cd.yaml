name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-cd.yaml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Frontend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

  build:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Check Frontend ECR repository
        env:
          FRONTEND_ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
        run: |
          if [ -z "$FRONTEND_ECR_REPOSITORY" ]; then
            echo "ERROR: FRONTEND_ECR_REPOSITORY is empty"
            exit 1
          fi

          echo "Frontend ECR repository is configured"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend Docker image
        env:
          FRONTEND_ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
        run: |
          IMAGE="$FRONTEND_ECR_REPOSITORY:${{ github.sha }}"

          echo "Building frontend image:"
          echo "$IMAGE"

          docker build \
            --build-arg "REACT_APP_MOVIE_API_URL=${{ secrets.REACT_APP_MOVIE_API_URL }}" \
            --tag "$IMAGE" \
            .

      - name: Push frontend Docker image
        env:
          FRONTEND_ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
        run: |
          IMAGE="$FRONTEND_ECR_REPOSITORY:${{ github.sha }}"

          echo "Pushing frontend image:"
          echo "$IMAGE"

          docker push "$IMAGE"

  deploy:
    name: Deploy Frontend to EKS
    runs-on: ubuntu-latest
    needs:
      - build

    defaults:
      run:
        working-directory: starter/frontend/k8s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Check Frontend ECR repository
        env:
          FRONTEND_ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
        run: |
          if [ -z "$FRONTEND_ECR_REPOSITORY" ]; then
            echo "ERROR: FRONTEND_ECR_REPOSITORY is empty"
            exit 1
          fi

          echo "Frontend ECR repository is configured"

      - name: Verify frontend image exists in ECR
        env:
          FRONTEND_ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
        run: |
          REPOSITORY_NAME="${FRONTEND_ECR_REPOSITORY##*/}"

          aws ecr describe-images \
            --repository-name "$REPOSITORY_NAME" \
            --region "$AWS_REGION" \
            --image-ids imageTag="${{ github.sha }}"

      - name: Deploy frontend image
        env:
          FRONTEND_ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
        run: |
          IMAGE="$FRONTEND_ECR_REPOSITORY:${{ github.sha }}"

          echo "Deploying frontend image:"
          echo "$IMAGE"

          kubectl set image deployment/frontend \
            frontend="$IMAGE"

      - name: Check frontend rollout
        run: |
          kubectl rollout status deployment/frontend --timeout=5m

      - name: Verify frontend deployment
        run: |
          kubectl get deployment frontend -o wide
          kubectl get pods -l app=frontend -o wide
          kubectl get svc frontend -o wide

          echo "Deployed frontend image:"
          kubectl get deployment frontend \
            -o jsonpath="{.spec.template.spec.containers[0].image}"

          echo